<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tontine — registre du groupe</title>
<!--
  POURQUOI PAS DE REACT, NI D'OUTIL DE CONSTRUCTION.

  N-USG-02 impose moins de 100 ko par écran utile, sur connexion lente. Un
  bundle React minimal dépasse 140 ko avant la première ligne de code métier.
  Ici, page + style + script tiennent sous 40 ko, sans étape de construction et
  sans dépendance : le fichier servi est le fichier écrit.

  Le corollaire assumé : pas de composants, pas de JSX. L'application reste
  petite — huit écrans — et le rendu se fait par fonctions qui produisent du
  HTML. Au-delà d'une vingtaine d'écrans, l'arbitrage mériterait d'être revu.
-->
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ═══════════════ CONNEXION ═══════════════ -->
<section id="ecran-connexion" class="ecran actif">
  <div class="connexion">
    <h1>Tontine</h1>
    <p class="sous-titre">Registre du groupe</p>

    <form id="formulaire-connexion" autocomplete="on">
      <label for="telephone">Téléphone</label>
      <input id="telephone" name="telephone" type="tel" inputmode="tel"
             placeholder="+237690110002" autocomplete="username" required>

      <label for="mot-de-passe">Mot de passe</label>
      <input id="mot-de-passe" name="mot_de_passe" type="password"
             autocomplete="current-password" required>

      <button type="submit" class="principal">Se connecter</button>
      <p id="erreur-connexion" class="erreur" hidden></p>
    </form>

    <p class="aide">
      Démonstration — <code>+237690110002</code> / <code>tontine2026</code>
    </p>
  </div>
</section>

<!-- ═══════════════ APPLICATION ═══════════════ -->
<div id="application" hidden>

  <header class="entete">
    <div>
      <strong id="nom-groupe"></strong>
      <span id="identite" class="discret"></span>
    </div>
    <button id="deconnexion" class="lien">Quitter</button>
  </header>

  <!-- L'onglet affiché dépend des rôles : une trésorière arrive sur la saisie,
       un membre sur sa situation. Les onglets sans habilitation ne sont pas
       grisés, ils sont absents — un bouton inactif invite à chercher comment
       le débloquer. -->
  <nav class="onglets" id="onglets"></nav>

  <main id="contenu"></main>

  <div id="message" class="message" hidden></div>
</div>

<script src="/app.js"></script>
</body>
</html>
